<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indie Developer Portfolio</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1d1d1f;
            --text-secondary: #86868b;
            --accent-color: #0071e3;
            --border-color: #d2d2d7;
            --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --text-color: #f5f5f7;
                --text-secondary: #86868b;
                --border-color: #424245;
                --accent-color: #2997ff;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        h1 {
            font-size: 40px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
        }

        .last-updated {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        h2 {
            font-size: 24px;
            font-weight: 600;
            margin-top: 40px;
            margin-bottom: 15px;
            letter-spacing: -0.01em;
        }

        p {
            font-size: 16px;
            margin-bottom: 20px;
            color: var(--text-color);
            opacity: 0.9;
        }

        ul {
            margin-bottom: 20px;
            padding-left: 20px;
        }

        li {
            font-size: 16px;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        a {
            color: var(--accent-color);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 60px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Indie Developer Portfolio</h1>
        <div class="last-updated">Welcome to my workspace</div>
        
        <h2>My Applications</h2>
        <ul>
            <li><a href="apps/offloop">OffLoop - Digital well-being & distraction control</a></li>
        </ul>

        <div class="footer">
            &copy; 2026 Indie Developer. All rights reserved.
        </div>
    </div>
</body>

</html>
